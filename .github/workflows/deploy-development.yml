# Development theme deploy — Phase 2
# Manual workflow_dispatch only. No push trigger.
# mode=dry-run: Phase 1 behaviour (no remote file changes).
# mode=inspect: read-only hashes and metadata for the I-0004 files. No remote writes.
# mode=deploy: backup current theme, rsync, smoke test.
# Does not access Production.
# Does not auto-rollback. Keep the backup and fail the job on smoke-test error.
#
# Backup timestamp is UTC (YYYYMMDDHHMMSS).
# Backup path: ${DEV_DEPLOY_PATH}.bak-YYYYMMDDHHMMSS
#   example: .../wp-content/themes/andbld.bak-20260821083000
# Backup is a sibling of the live theme directory, so rsync --delete
# cannot touch it.
#
# Backup generations: Phase 2 accumulates backups. It does not delete
# old andbld.bak-* directories (no remote rm). Keep/prune is a later phase.
#
# Rollback (manual, do not run from this workflow):
#   1. Identify the backup basename from the deploy log (andbld.bak-UTC).
#   2. SSH to Development.
#   3. Confirm live path is the Development theme directory
#      (contains dev-20260601.andbld.co.jp and ends with
#      /wp-content/themes/andbld).
#   4. Rename the live theme aside, then rename the chosen backup to andbld.
# Human Review is still required after rollback.
#
# Future: add push to main with path filter after Human Approval of deploy.
# on:
#   push:
#     branches: [main]
#     paths:
#       - 'wordpress/wp-content/themes/andbld/**'
#
# Human Review after a successful deploy (required before Done):
#   Development TOP, PC, SP, BLOG, CSS/JS, Console Error,
#   changed sections, existing sections.

name: Deploy to Development

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run compares only. inspect reads Development hashes and metadata. deploy writes to Development.
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - inspect
          - deploy

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy-development:
    name: Development ${{ inputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    env:
      DEPLOY_MODE: ${{ inputs.mode }}
      DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
      DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
      DEV_SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
      DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
      DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
      DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
      DEV_SITE_URL: ${{ secrets.DEV_SITE_URL }}
      SOURCE_THEME: wordpress/wp-content/themes/andbld
      PRODUCTION_THEME_PATH: /home/andbld/andbld.co.jp/public_html/wp-content/themes/andbld
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup SSH
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          # Do not echo secrets or key files.
          printf '%s\n' "${DEV_SSH_PRIVATE_KEY}" | tr -d '\r' > "${HOME}/.ssh/development_key"
          chmod 600 "${HOME}/.ssh/development_key"
          printf '%s\n' "${DEV_SSH_KNOWN_HOSTS}" | tr -d '\r' > "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"
          echo "SSH files prepared"

      - name: Validate mode and deploy path
        run: |
          set -euo pipefail
          case "${DEPLOY_MODE}" in
            dry-run|inspect|deploy) ;;
            *)
              echo "Mode safety check failed: mode must be dry-run, inspect, or deploy" >&2
              exit 1
              ;;
          esac
          echo "Mode: ${DEPLOY_MODE}"

          : "${DEV_DEPLOY_PATH:?DEV_DEPLOY_PATH is missing}"
          path="${DEV_DEPLOY_PATH%/}"

          case "${path}" in
            */wp-content/themes/andbld) ;;
            *)
              echo "Path safety check failed: rule 1 (must end with /wp-content/themes/andbld)" >&2
              exit 1
              ;;
          esac

          case "${path}" in
            *dev-20260601.andbld.co.jp*) ;;
            *)
              echo "Path safety check failed: rule 2 (must contain Development site identifier)" >&2
              exit 1
              ;;
          esac

          if [ "${path}" = "${PRODUCTION_THEME_PATH}" ]; then
            echo "Path safety check failed: rule 3 (Production theme path is not allowed)" >&2
            exit 1
          fi

          case "${path}" in
            */public_html|*/themes)
              echo "Path safety check failed: rule 4 (path is too broad)" >&2
              exit 1
              ;;
          esac

          echo "Deploy path safety check: ok"

          if [ "${DEPLOY_MODE}" = "deploy" ]; then
            : "${DEV_SITE_URL:?DEV_SITE_URL is missing}"
            site="${DEV_SITE_URL%/}"
            case "${site}" in
              https://dev-20260601.andbld.co.jp|https://dev-20260601.andbld.co.jp/*) ;;
              *)
                echo "Site URL safety check failed: not the Development URL" >&2
                exit 1
                ;;
            esac
            echo "Development site URL safety check: ok"
          fi

      - name: Check local source theme
        run: |
          set -euo pipefail
          if [ ! -d "${SOURCE_THEME}" ]; then
            echo "Local theme directory is missing" >&2
            exit 1
          fi
          echo "Local source theme: ok"

      - name: SSH connectivity test
        run: |
          set -euo pipefail
          : "${DEV_SSH_HOST:?DEV_SSH_HOST is missing}"
          : "${DEV_SSH_USER:?DEV_SSH_USER is missing}"
          : "${DEV_SSH_PORT:?DEV_SSH_PORT is missing}"
          path="${DEV_DEPLOY_PATH%/}"

          ssh \
            -i "${HOME}/.ssh/development_key" \
            -p "${DEV_SSH_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -o BatchMode=yes \
            "${DEV_SSH_USER}@${DEV_SSH_HOST}" \
            "test \"\$(whoami)\" = '${DEV_SSH_USER}' && test -d '${path}' && test -w '${path}' && command -v rsync >/dev/null"

          echo "SSH user check: ok"
          echo "Remote directory exists: ok"
          echo "Remote directory writable: ok"
          echo "Remote rsync exists: ok"

      - name: Inspect Development theme
        if: ${{ inputs.mode == 'inspect' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CANDIDATE_SHA=be11488f9c75f7fe1a79fb6ac6ed999ff80e7a89
          DEPLOYED_SHA=248943978ca8d6cea51b8fee7e2ded65cbdda6b1
          files=(
            functions.php
            page-frontpage.php
            style.css
            css/headfoot.css
            css/page-contents.css
            css/toppage-contents.css
            section-parts/cta-block1.php
            template-parts/inc/about-page.php
            template-parts/inc/services-page.php
            assets/images/andbld-value-cycle-icons.png
          )
          dirs=(
            .
            assets
            assets/images
            css
            section-parts
            template-parts
            template-parts/inc
            img
            inc
            js
            languages
          )

          : "${DEV_DEPLOY_PATH:?DEV_DEPLOY_PATH is missing}"
          : "${GITHUB_TOKEN:?GITHUB_TOKEN is missing}"
          path="${DEV_DEPLOY_PATH%/}"

          case "${path}" in
            */wp-content/themes/andbld) ;;
            *)
              echo "Path safety check failed: rule 1 (must end with /wp-content/themes/andbld)" >&2
              exit 1
              ;;
          esac
          case "${path}" in
            *dev-20260601.andbld.co.jp*) ;;
            *)
              echo "Path safety check failed: rule 2 (must contain Development site identifier)" >&2
              exit 1
              ;;
          esac
          if [ "${path}" = "${PRODUCTION_THEME_PATH}" ]; then
            echo "Path safety check failed: rule 3 (Production theme path is not allowed)" >&2
            exit 1
          fi
          case "${path}" in
            */public_html|*/themes)
              echo "Path safety check failed: rule 4 (path is too broad)" >&2
              exit 1
              ;;
          esac

          head_sha="$(git rev-parse HEAD)"
          if [ "${head_sha}" != "${CANDIDATE_SHA}" ]; then
            echo "Inspect refused: checkout does not match the candidate commit" >&2
            exit 1
          fi

          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT

          for rel in "${files[@]}"; do
            case "${rel}" in
              /*|*..*)
                echo "Relative path refused" >&2
                exit 1
                ;;
            esac
            if [ ! -f "${SOURCE_THEME}/${rel}" ]; then
              echo "Inspect refused: candidate file is missing (${rel})" >&2
              exit 1
            fi
            blob_sum="$(git cat-file blob "HEAD:${SOURCE_THEME}/${rel}" | sha256sum)"
            blob_sum="${blob_sum%% *}"
            work_sum="$(sha256sum "${SOURCE_THEME}/${rel}")"
            work_sum="${work_sum%% *}"
            if [ "${blob_sum}" != "${work_sum}" ]; then
              echo "Inspect refused: working tree does not match candidate commit (${rel})" >&2
              exit 1
            fi
            printf '%s\n' "${work_sum}" > "${work}/candidate.$(printf '%s' "${rel}" | sha256sum | awk '{print $1}')"

            body="${work}/deployed.body"
            code="$(curl -sS --max-time 30 -o "${body}" -w '%{http_code}' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${SOURCE_THEME}/${rel}?ref=${DEPLOYED_SHA}")" || {
              echo "Git content request failed (${rel})" >&2
              exit 1
            }
            case "${code}" in
              200)
                deployed_sum="$(sha256sum "${body}")"
                deployed_sum="${deployed_sum%% *}"
                ;;
              404)
                deployed_sum="ABSENT"
                ;;
              *)
                echo "Git content request failed (${rel}) status ${code}" >&2
                exit 1
                ;;
            esac
            rm -f "${body}"
            key="$(printf '%s' "${rel}" | sha256sum | awk '{print $1}')"
            printf '%s\n' "${deployed_sum}" > "${work}/deployed.${key}"
          done
          echo "Candidate tree check: ok"

          ssh \
            -i "${HOME}/.ssh/development_key" \
            -p "${DEV_SSH_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -o BatchMode=yes \
            "${DEV_SSH_USER}@${DEV_SSH_HOST}" \
            "bash -s -- '${path}'" > "${work}/remote.tsv" <<'EOF'
          set -euo pipefail
          theme="$1"
          case "${theme}" in
            */wp-content/themes/andbld) ;;
            *)
              echo "Path safety check failed: rule 1" >&2
              exit 1
              ;;
          esac
          case "${theme}" in
            *dev-20260601.andbld.co.jp*) ;;
            *)
              echo "Path safety check failed: rule 2" >&2
              exit 1
              ;;
          esac
          if [ "${theme}" = "/home/andbld/andbld.co.jp/public_html/wp-content/themes/andbld" ]; then
            echo "Path safety check failed: rule 3 (Production theme path is not allowed)" >&2
            exit 1
          fi
          case "${theme}" in
            */public_html|*/themes)
              echo "Path safety check failed: rule 4" >&2
              exit 1
              ;;
          esac
          cd "${theme}" || {
            echo "Theme directory is not accessible" >&2
            exit 1
          }
          command -v stat >/dev/null 2>&1 || {
            echo "stat is missing" >&2
            exit 1
          }
          command -v sha256sum >/dev/null 2>&1 || {
            echo "sha256sum is missing" >&2
            exit 1
          }

          files=(
            functions.php
            page-frontpage.php
            style.css
            css/headfoot.css
            css/page-contents.css
            css/toppage-contents.css
            section-parts/cta-block1.php
            template-parts/inc/about-page.php
            template-parts/inc/services-page.php
            assets/images/andbld-value-cycle-icons.png
          )
          dirs=(
            .
            assets
            assets/images
            css
            section-parts
            template-parts
            template-parts/inc
            img
            inc
            js
            languages
          )

          for rel in "${files[@]}"; do
            case "${rel}" in
              /*|*..*)
                echo "Relative path refused" >&2
                exit 1
                ;;
            esac
            if [ -L "${rel}" ]; then
              echo "Inspect refused: symlink (${rel})" >&2
              exit 1
            fi
            if [ -f "${rel}" ]; then
              mode="$(stat -c '%a' "${rel}")"
              owner="$(stat -c '%U' "${rel}")"
              group="$(stat -c '%G' "${rel}")"
              size="$(stat -c '%s' "${rel}")"
              mtime="$(stat -c '%Y' "${rel}")"
              sum="$(sha256sum -- "${rel}")"
              sum="${sum%% *}"
              printf 'FILE\t%s\tEXISTS\t%s\t%s\t%s\t%s\t%s\t%s\n' \
                "${rel}" "${mode}" "${owner}" "${group}" "${size}" "${mtime}" "${sum}"
            else
              printf 'FILE\t%s\tABSENT\n' "${rel}"
            fi
          done

          for rel in "${dirs[@]}"; do
            case "${rel}" in
              /*|*..*)
                echo "Relative path refused" >&2
                exit 1
                ;;
            esac
            if [ -L "${rel}" ]; then
              echo "Inspect refused: symlink (${rel})" >&2
              exit 1
            fi
            if [ -d "${rel}" ]; then
              mode="$(stat -c '%a' "${rel}")"
              owner="$(stat -c '%U' "${rel}")"
              group="$(stat -c '%G' "${rel}")"
              mtime="$(stat -c '%Y' "${rel}")"
              printf 'DIR\t%s\tEXISTS\t%s\t%s\t%s\t%s\n' \
                "${rel}" "${mode}" "${owner}" "${group}" "${mtime}"
            else
              printf 'DIR\t%s\tABSENT\n' "${rel}"
            fi
          done
          EOF

          echo "candidate=${CANDIDATE_SHA}"
          echo "deployed=${DEPLOYED_SHA}"
          declare -A file_seen=()
          declare -A dir_seen=()
          seen_files=0
          seen_dirs=0
          while IFS= read -r line || [ -n "${line}" ]; do
            [ -n "${line}" ] || continue
            kind="$(printf '%s' "${line}" | awk -F '\t' '{print $1}')"
            rel="$(printf '%s' "${line}" | awk -F '\t' '{print $2}')"
            state="$(printf '%s' "${line}" | awk -F '\t' '{print $3}')"
            case "${kind}" in
              FILE)
                allowed=0
                for expect in "${files[@]}"; do
                  if [ "${rel}" = "${expect}" ]; then
                    allowed=1
                  fi
                done
                if [ "${allowed}" -ne 1 ] || [ -n "${file_seen[${rel}]+x}" ]; then
                  echo "Unexpected inspect record" >&2
                  exit 1
                fi
                file_seen["${rel}"]=1
                key="$(printf '%s' "${rel}" | sha256sum | awk '{print $1}')"
                candidate_sum="$(cat "${work}/candidate.${key}")"
                deployed_sum="$(cat "${work}/deployed.${key}")"
                if [ "${state}" = "ABSENT" ]; then
                  verdict="ABSENT"
                  printf 'FILE\t%s\t%s\tgit_deployed=%s\tgit_candidate=%s\n' \
                    "${rel}" "${verdict}" "${deployed_sum}" "${candidate_sum}"
                elif [ "${state}" = "EXISTS" ]; then
                  mode="$(printf '%s' "${line}" | awk -F '\t' '{print $4}')"
                  owner="$(printf '%s' "${line}" | awk -F '\t' '{print $5}')"
                  group="$(printf '%s' "${line}" | awk -F '\t' '{print $6}')"
                  size="$(printf '%s' "${line}" | awk -F '\t' '{print $7}')"
                  mtime="$(printf '%s' "${line}" | awk -F '\t' '{print $8}')"
                  remote_sum="$(printf '%s' "${line}" | awk -F '\t' '{print $9}')"
                  case "${mode}" in
                    [0-9][0-9][0-9]|[0-9][0-9][0-9][0-9]) ;;
                    *)
                      echo "Unexpected inspect record" >&2
                      exit 1
                      ;;
                  esac
                  case "${size}" in
                    *[!0-9]*)
                      echo "Unexpected inspect record" >&2
                      exit 1
                      ;;
                  esac
                  case "${mtime}" in
                    *[!0-9]*)
                      echo "Unexpected inspect record" >&2
                      exit 1
                      ;;
                  esac
                  case "${owner}" in
                    ''|*[!A-Za-z0-9_.-]*)
                      echo "Unexpected inspect record" >&2
                      exit 1
                      ;;
                  esac
                  case "${group}" in
                    ''|*[!A-Za-z0-9_.-]*)
                      echo "Unexpected inspect record" >&2
                      exit 1
                      ;;
                  esac
                  case "${remote_sum}" in
                    *[!0-9a-f]*)
                      echo "Unexpected inspect record" >&2
                      exit 1
                      ;;
                  esac
                  if [ "${#remote_sum}" -ne 64 ]; then
                    echo "Unexpected inspect record" >&2
                    exit 1
                  fi
                  if [ "${remote_sum}" = "${candidate_sum}" ]; then
                    verdict="MATCH_CANDIDATE"
                  elif [ "${deployed_sum}" != "ABSENT" ] && [ "${remote_sum}" = "${deployed_sum}" ]; then
                    verdict="MATCH_DEPLOYED"
                  else
                    verdict="DIFFER_BOTH"
                  fi
                  note=""
                  if [ "${verdict}" = "MATCH_CANDIDATE" ] && [ "${deployed_sum}" != "ABSENT" ] && [ "${remote_sum}" = "${deployed_sum}" ]; then
                    note=$'\tsame_as_deployed=yes'
                  fi
                  printf 'FILE\t%s\t%s\tmode=%s\towner=%s\tgroup=%s\tsize=%s\tmtime=%s\tremote=%s\tdeployed=%s\tcandidate=%s%b\n' \
                    "${rel}" "${verdict}" "${mode}" "${owner}" "${group}" "${size}" "${mtime}" "${remote_sum}" "${deployed_sum}" "${candidate_sum}" "${note}"
                else
                  echo "Unexpected inspect record" >&2
                  exit 1
                fi
                seen_files=$((seen_files + 1))
                ;;
              DIR)
                allowed=0
                for expect in "${dirs[@]}"; do
                  if [ "${rel}" = "${expect}" ]; then
                    allowed=1
                  fi
                done
                if [ "${allowed}" -ne 1 ] || [ -n "${dir_seen[${rel}]+x}" ]; then
                  echo "Unexpected inspect record" >&2
                  exit 1
                fi
                dir_seen["${rel}"]=1
                if [ "${state}" = "ABSENT" ]; then
                  printf 'DIR\t%s\tABSENT\n' "${rel}"
                elif [ "${state}" = "EXISTS" ]; then
                  mode="$(printf '%s' "${line}" | awk -F '\t' '{print $4}')"
                  owner="$(printf '%s' "${line}" | awk -F '\t' '{print $5}')"
                  group="$(printf '%s' "${line}" | awk -F '\t' '{print $6}')"
                  mtime="$(printf '%s' "${line}" | awk -F '\t' '{print $7}')"
                  case "${mode}" in
                    [0-9][0-9][0-9]|[0-9][0-9][0-9][0-9]) ;;
                    *)
                      echo "Unexpected inspect record" >&2
                      exit 1
                      ;;
                  esac
                  case "${mtime}" in
                    *[!0-9]*)
                      echo "Unexpected inspect record" >&2
                      exit 1
                      ;;
                  esac
                  case "${owner}" in
                    ''|*[!A-Za-z0-9_.-]*)
                      echo "Unexpected inspect record" >&2
                      exit 1
                      ;;
                  esac
                  case "${group}" in
                    ''|*[!A-Za-z0-9_.-]*)
                      echo "Unexpected inspect record" >&2
                      exit 1
                      ;;
                  esac
                  printf 'DIR\t%s\tmode=%s\towner=%s\tgroup=%s\tmtime=%s\n' \
                    "${rel}" "${mode}" "${owner}" "${group}" "${mtime}"
                else
                  echo "Unexpected inspect record" >&2
                  exit 1
                fi
                seen_dirs=$((seen_dirs + 1))
                ;;
              *)
                echo "Unexpected inspect record" >&2
                exit 1
                ;;
            esac
          done < "${work}/remote.tsv"

          if [ "${seen_files}" -ne "${#files[@]}" ] || [ "${seen_dirs}" -ne "${#dirs[@]}" ]; then
            echo "Inspect record count mismatch" >&2
            exit 1
          fi
          echo "Inspect finished (no remote changes)"

      - name: Backup Development theme
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          set -euo pipefail
          path="${DEV_DEPLOY_PATH%/}"
          parent="${path%/*}"
          stamp="$(date -u +%Y%m%d%H%M%S)"
          backup="${path}.bak-${stamp}"
          base="$(basename "${backup}")"

          case "${parent}" in
            */themes) ;;
            *)
              echo "Backup safety check failed: parent is not themes" >&2
              exit 1
              ;;
          esac

          case "${parent}" in
            *dev-20260601.andbld.co.jp*) ;;
            *)
              echo "Backup safety check failed: parent is not Development" >&2
              exit 1
              ;;
          esac

          case "${base}" in
            andbld.bak-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *)
              echo "Backup safety check failed: invalid backup name" >&2
              exit 1
              ;;
          esac

          if [ "${backup}" = "${path}" ] || [ "${backup}" = "${PRODUCTION_THEME_PATH}" ]; then
            echo "Backup safety check failed: backup path is not allowed" >&2
            exit 1
          fi

          ssh \
            -i "${HOME}/.ssh/development_key" \
            -p "${DEV_SSH_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -o BatchMode=yes \
            "${DEV_SSH_USER}@${DEV_SSH_HOST}" \
            "test ! -e '${backup}' && cp -a '${path}' '${backup}' && test -d '${backup}'"

          echo "Backup created: ${base}"
          echo "Backup is outside the live theme directory"
          echo "Old backups are kept (no prune in Phase 2)"

      - name: Wait before rsync
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          set -euo pipefail
          # Xserver may reset SSH if several sessions start in a short window.
          echo "Waiting 10s after backup before rsync"
          sleep 10

      - name: rsync dry-run
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          set -euo pipefail
          path="${DEV_DEPLOY_PATH%/}"

          if ! command -v rsync >/dev/null; then
            echo "rsync is missing on the runner" >&2
            exit 1
          fi

          echo "Starting rsync dry-run (no remote changes)"
          rsync -avzn --delete --checksum \
            --exclude '.DS_Store' \
            --exclude 'Thumbs.db' \
            --exclude 'Desktop.ini' \
            --exclude '*.bak' \
            --exclude '*.tmp' \
            --exclude '*.log' \
            --exclude '*.map' \
            --exclude 'node_modules/' \
            --exclude 'vendor/' \
            -e "ssh -i ${HOME}/.ssh/development_key -p ${DEV_SSH_PORT} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${HOME}/.ssh/known_hosts -o BatchMode=yes" \
            "${SOURCE_THEME}/" \
            "${DEV_SSH_USER}@${DEV_SSH_HOST}:${path}/"

          echo "rsync dry-run finished (no remote changes)"

      - name: rsync deploy
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          set -euo pipefail
          path="${DEV_DEPLOY_PATH%/}"

          if ! command -v rsync >/dev/null; then
            echo "rsync is missing on the runner" >&2
            exit 1
          fi

          # Retry only connection-class failures (SSH handshake reset, socket,
          # protocol drop, timeout). Do not retry usage, I/O, or generic
          # partial-transfer errors: those are not fixed by waiting, and a
          # blind --delete retry after an unknown mid-file failure is avoided.
          # A full rsync retry after a handshake failure is safe: no files
          # were written. Backup already exists if this step runs.
          retryable_rsync() {
            case "$1" in
              10|12|30|35|255) return 0 ;;
              *) return 1 ;;
            esac
          }

          attempt=1
          max_attempts=3
          while true; do
            echo "rsync deploy attempt ${attempt}/${max_attempts}"
            set +e
            rsync -avz --delete --checksum \
              --exclude '.DS_Store' \
              --exclude 'Thumbs.db' \
              --exclude 'Desktop.ini' \
              --exclude '*.bak' \
              --exclude '*.tmp' \
              --exclude '*.log' \
              --exclude '*.map' \
              --exclude 'node_modules/' \
              --exclude 'vendor/' \
              -e "ssh -i ${HOME}/.ssh/development_key -p ${DEV_SSH_PORT} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${HOME}/.ssh/known_hosts -o BatchMode=yes" \
              "${SOURCE_THEME}/" \
              "${DEV_SSH_USER}@${DEV_SSH_HOST}:${path}/"
            rc=$?
            set -e

            if [ "${rc}" -eq 0 ]; then
              echo "rsync deploy finished"
              break
            fi

            if [ "${attempt}" -ge "${max_attempts}" ] || ! retryable_rsync "${rc}"; then
              echo "rsync deploy failed" >&2
              exit "${rc}"
            fi

            echo "Retryable SSH/connection error; waiting 10s"
            sleep 10
            attempt=$((attempt + 1))
          done

      - name: Smoke test
        if: ${{ inputs.mode == 'deploy' }}
        env:
          DEV_BASIC_AUTH_USER: ${{ secrets.DEV_BASIC_AUTH_USER }}
          DEV_BASIC_AUTH_PASSWORD: ${{ secrets.DEV_BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          site="${DEV_SITE_URL%/}"
          top="${site}/"
          css="${site}/wp-content/themes/andbld/style.css"

          case "${site}" in
            https://dev-20260601.andbld.co.jp) ;;
            *)
              echo "Smoke test refused: URL is not Development" >&2
              exit 1
              ;;
          esac

          if [ -z "${DEV_BASIC_AUTH_USER:-}" ] || [ -z "${DEV_BASIC_AUTH_PASSWORD:-}" ]; then
            echo "Smoke test refused: Basic auth secrets are missing" >&2
            exit 1
          fi

          # Final HTTP status must be 2xx. Follow redirects. Discard body.
          # Do not use curl -f as the success condition.
          # Run curl on Development (Japan) so WordPress foreign-access
          # restriction does not false-fail a GitHub-hosted runner.
          # Basic auth is required. Credentials go to remote bash via stdin
          # (quoted), not in the ssh argv. Do not print URL, secrets, body,
          # status codes, or Authorization headers. Do not use set -x or curl -v.
          http_code() {
            url="$1"
            ssh \
              -i "${HOME}/.ssh/development_key" \
              -p "${DEV_SSH_PORT}" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              -o BatchMode=yes \
              "${DEV_SSH_USER}@${DEV_SSH_HOST}" \
              bash -s <<EOF
          if ! command -v curl >/dev/null; then echo 000; exit 0; fi
          user=${DEV_BASIC_AUTH_USER@Q}
          pass=${DEV_BASIC_AUTH_PASSWORD@Q}
          url=${url@Q}
          code=\$(curl -sS -L --max-time 30 -o /dev/null -w '%{http_code}' --user "\$user:\$pass" "\$url" 2>/dev/null) || code=000
          printf '%s\n' "\$code"
          EOF
          }

          check_2xx() {
            label="$1"
            url="$2"
            code="$(http_code "${url}" | tr -d '\r' | tail -n 1)"
            case "${code}" in
              2[0-9][0-9])
                echo "Smoke test ${label}: ok"
                ;;
              *)
                echo "Smoke test ${label}: failed" >&2
                exit 1
                ;;
            esac
          }

          check_2xx TOP "${top}"
          check_2xx style.css "${css}"

          echo "Deploy job finished. Human Review is still required."
          echo "Automatic rollback is not enabled. Backup was left in place."
