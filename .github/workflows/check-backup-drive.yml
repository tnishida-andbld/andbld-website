name: Check backup Drive (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-backup-drive
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.repository_id == '1294571559' && github.repository_owner_id == '232493821'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout approved main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check required configuration
        env:
          BACKUP_DRIVE_ID: ${{ vars.BACKUP_DRIVE_ID }}
          BACKUP_WIF_PROVIDER: ${{ vars.BACKUP_WIF_PROVIDER }}
          BACKUP_SERVICE_ACCOUNT: ${{ vars.BACKUP_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          names = ('BACKUP_DRIVE_ID', 'BACKUP_WIF_PROVIDER', 'BACKUP_SERVICE_ACCOUNT')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              print('Missing environment variables: ' + ', '.join(missing))
              sys.exit(1)
          PY
      - name: Authenticate backup service account with read-only scope
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.BACKUP_WIF_PROVIDER }}
          service_account: ${{ vars.BACKUP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
      - name: Read shared-drive metadata
        env:
          BACKUP_DRIVE_ID: ${{ vars.BACKUP_DRIVE_ID }}
          DRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 scripts/check-backup-drive.py
