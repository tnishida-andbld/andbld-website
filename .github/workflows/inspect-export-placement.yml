name: Inspect export placement (metadata only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository_id == '1294571559' && github.repository_owner_id == '232493821' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    steps:
      - name: Checkout approved main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate offline fixtures on Linux
        run: |
          php -n -l scripts/inspect-export-placement.php
          php -n tests/test_export_placement.php
          python3 -m unittest discover -s tests -p test_export_placement_runner.py -v
      - name: Inspect fixed account metadata
        env:
          DEV_SSH_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
          DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: python3 scripts/inspect-export-placement.py
